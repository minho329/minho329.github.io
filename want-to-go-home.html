
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집가고싶다</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: #080810;
}

h1 {
  font-size: clamp(2.5rem, 12vw, 9rem);
  font-weight: 900;
  white-space: nowrap;
  letter-spacing: -0.06em;
  background: linear-gradient(
    90deg,
    #ff0055,
    #ff9900,
    #ffff00,
    #00ff88,
    #00ddff,
    #7744ff,
    #ff44cc,
    #ff0055
  );
  background-size: 300% 100%;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: rainbow 4s linear infinite, glow 1.5s ease-in-out infinite alternate;
}

@keyframes rainbow {
  from { background-position: 0% 50%; }
  to { background-position: 300% 50%; }
}

@keyframes glow {
  from {
    filter: brightness(0.9) drop-shadow(0 0 8px #ff44cc);
    transform: scale(1);
  }
  to {
    filter: brightness(1.4) drop-shadow(0 0 30px #7744ff);
    transform: scale(1.04);
  }
}

@media (max-width: 400px) {
  h1 {
    font-size: 12vw;
  }
}

@media (prefers-reduced-motion: reduce) {
  h1 {
    animation: none;
  }
}
</style>
</head>
<body>
  <h1>집가고싶다</h1>
</body>
</html>
